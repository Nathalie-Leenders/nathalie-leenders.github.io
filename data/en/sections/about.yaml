# a summary about you
summary: |
  Welcome to my corner of the internet! 💜
  
  I love sharing knowledge and helping others grow in the world of (low-code) development.

  In my free time I enjoy exploring new technologies, contributing to the community through badgers 🦡, and continuously learning (#alwayslearning). On the right you'll see a few of my badge(r)s, I couldn't fit all of them there. I love learning new things and continously keeping that knowledge up to date.
 
  I am passionate about sharing my own struggles and experiences, telling the story through my own eyes and hopefully helping someone along the way.

